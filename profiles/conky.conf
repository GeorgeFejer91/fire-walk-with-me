conky.config = {
    background = true, update_interval = 3, double_buffer = true, no_buffers = true,
    own_window = true, own_window_type = 'desktop', own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_class = 'Conky', own_window_title = 'Firefox Walk With Me',
    use_xft = true, font = 'Liberation Mono:size=11', xftalpha = 0.95,
    draw_shades = false, draw_outline = false, draw_borders = false,
    default_color = 'eee1c8', color1 = 'b2cf94', color2 = 'b5a399',
    alignment = 'top_right', gap_x = 65, gap_y = 65,
    minimum_width = 385, maximum_width = 385, border_inner_margin = 8,
};
conky.text = [[
${image @DATA@/identity/title.png -p 0,0 -s 385x64}
${voffset 64}${alignr}${color}${font Liberation Mono:size=42}${time %H:%M}${font}
${alignr}${color2}${time %A, %d %B %Y}
${voffset 18}${color1}${hr 1}
${voffset 8}${color2}CPU${alignr}${color}${cpu}%
${color2}MEMORY${alignr}${color}${mem} / ${memmax}
${voffset 10}${color1}${hr 1}
${voffset 10}${alignr}${color2}${font Liberation Mono:size=9}THE OWLS ARE NOT WHAT THEY SEEM.${font}
]];
